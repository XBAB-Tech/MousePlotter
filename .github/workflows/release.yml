name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build Linux CLI logger
        run: make -C linux_cli release

      - name: Build Windows GUI logger
        run: make -C windows_gui

      - name: Stage artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          tar -C linux_cli -czf "dist/mouseplotter-log-${VERSION}-linux-x86_64.tar.gz" mouseplotter-log LICENSE
          cp windows_gui/MousePlotter-Log.exe "dist/MousePlotter-Log-${VERSION}-windows-x86_64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
